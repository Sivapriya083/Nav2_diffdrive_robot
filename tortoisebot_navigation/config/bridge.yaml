# cmd_vel: ROS2 -> Gazebo
- ros_topic_name: "cmd_vel"
  gz_topic_name: "/model/tortoisebot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Odometry: Gazebo -> ROS2
- ros_topic_name: "odom"
  gz_topic_name: "/model/tortoisebot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# TF transforms: Gazebo -> ROS2
- ros_topic_name: "tf"
  gz_topic_name: "/model/tortoisebot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Joint states: Gazebo -> ROS2 (CORRECTED)
- ros_topic_name: "joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Laser scan: Gazebo -> ROS2
- ros_topic_name: "scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Camera depth image: Gazebo -> ROS2
- ros_topic_name: "camera/depth"
  gz_topic_name: "/world/custom_obstacle_world/model/tortoisebot/link/base_footprint/sensor/depth_camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Camera info: Gazebo -> ROS2
- ros_topic_name: "camera/camera_info"
  gz_topic_name: "/world/custom_obstacle_world/model/tortoisebot/link/base_footprint/sensor/depth_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Depth point cloud: Gazebo -> ROS2
- ros_topic_name: "camera/depth/points"
  gz_topic_name: "/world/custom_obstacle_world/model/tortoisebot/link/base_footprint/sensor/depth_camera/depth_image/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Clock: Gazebo -> ROS2
- ros_topic_name: "clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS